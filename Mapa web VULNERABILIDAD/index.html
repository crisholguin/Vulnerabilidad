<html lang="en">

        html, body, #map {

            padding: 0;

        }

            position: absolute;
            left: 350px;

    <body>
        <div id="side-panel" style="position: absolute; top: 0; left: 0; width: 355px; height: 100%; z-index: 2000; background: white; box-shadow: 2px 0 5px rgba(0,0,0,0.2); display: flex; flex-direction: column; font-family: sans-serif;">
            
            <div style="padding: 20px 15px 2px 15px; background: #2c3e50; color: white;">
                <h2 style="margin: 0; font-size: 18px;">Características de los hogares<br> y sus miembros</h2>
                <h3 style="margin-top: 10px; font-size: 14px;color: #8c9699;">Localidades de Tierra del Fuego</h3>
            </div>
            
            <div id="selector-container" style="padding: 15px 20px 12px 20px; border-bottom: 1px solid #eee; background: #f8f9fa;">
                <label for="indicadorSelect"><b>1. Indicador Sociodemográfico:</b></label><br>
                <select id="indicadorSelect" style="width: 100%; margin-top: 5px; margin-bottom: 15px; padding: 5px;">
                    <option value="">Seleccione un indicador...</option>
                </select>
                
                <div id="info-variable-container" style="padding: 0 15px 15px 15px; display: none;">
                    <div id="info-variable-card">
                        <p id="info-desc" style="margin: 0; font-size: 13px; color: #5d6d7e; line-height: 1.4;"></p>
                    </div>
                </div>

                <label for="variableSelect"><b>2. Indicador Específico:</b></label><br>
                <select id="variableSelect" style="width: 100%; margin-top: 5px; padding: 3px;" disabled>
                    <option value="">Seleccione indicador primero...</option>
                </select>
            </div>

            <div style="padding: 10px 20px 10px 20px; flex-grow: 1; overflow-y: auto;">
                <div id="report-data">
                    <p style="color: #7f8c8d; font-style: italic;">Seleccione un indicador y una variable para visualizar los datos en el mapa.</p>
                </div>
            </div>
            
            <div id="chart-container" style="padding: 15px; background: #f4f4f4; border-top: 1px solid #ddd; height: 340px; display: flex; flex-direction: column;">
                <div id="chart-header" style="flex: 0 1 auto;">
                    <p style="font-size: 12px; color: #95a5a6; text-align: center; margin: 10px 0;">
                        Haga clic en una localidad para ver el gráfico.
                    </p>
                </div>
                <div style="flex: 1 1 auto; position: relative; min-height: 0;">
                    <canvas id="vulnerabilidadChart"></canvas>
                </div>
            </div>
        </div>
        <div id="legend-container" class="legend" style="display: none;"></div>

        <div id="map"></div>

        <!-- Datos de indicadores -->
        <script src="data/indicadores.js"></script>

        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;
            highlightLayer.openPopup();
        }

        const mapeoLocalidades = {
            1: "rio_gde",
            2: "tolhuin",
            3: "ushuaia"
        };

        // 2. Función de Debug (Separada para limpieza)
        function actualizarExtract(codGrupo, codVar, dataFinal) {
            const reportContent = document.getElementById('report-data');
            const metaGrupo = indicadores_ref.find(g => g.cod_grupo === codGrupo);
            const labelVar = metaGrupo.variables[codVar].label;
            const descVar = metaGrupo.variables[codVar].desc;

            if (!reportContent) return;

            reportContent.innerHTML = `
                <div style="background: #e8f4fd; padding: 10px; border-radius: 4px; border-left: 4px solid #3498db; margin-bottom: 15px;">
                    <p style="margin: 0; font-size: 14px;"><b>${labelVar}</b></p>
                    <p style="margin: 2px 0 0 0; font-size: 13px; color: #2c3e50;">${descVar}</p>
                </div>
                <table style="width: 100%; font-size: 13px; border-collapse: collapse; margin-top: 5px;">
                    <tr style="border-bottom: 1px solid #eee;"><td style="padding: 5px 0;">Río Grande:</td><td style="text-align: right;"><b>${(dataFinal.rio_gde * 100).toFixed(2)}%</b></td></tr>
                    <tr style="border-bottom: 1px solid #eee;"><td style="padding: 5px 0;">Tolhuin:</td><td style="text-align: right;"><b>${(dataFinal.tolhuin * 100).toFixed(2)}%</b></td></tr>
                    <tr style="border-bottom: 1px solid #eee;"><td style="padding: 5px 0;">Ushuaia:</td><td style="text-align: right;"><b>${(dataFinal.ushuaia * 100).toFixed(2)}%</b></td></tr>
                </table>
            `;
        }



        //Tamaño de los puntos basado en el valor del indicador
        const RADIO_MIN = 15;  // Tamaño para valor 0
        const RADIO_MAX = 50; // Tamaño para valor 1
        const COLOR_DEFECTO = '#8df0f0'; // Color para valor 0
        const COLOR_ACTIVO = '#3498db'; // Color inicial
        function calcularRadio(valor) {
            // Interpolación: radio = min + (valor * (max - min))
            return RADIO_MIN + (valor * (RADIO_MAX - RADIO_MIN));
        }

        //CATEGORIAS
        const RANGOS_CATEGORIAS = [0, 0, 0.05, 0.10, 0.20, 0.45, 0.70, 0.90];

        const COLORES_CATEGORIAS = [
            '#f0f9e8', // 0% 
            '#d1edcf', // 0% - 5%
            '#b1e1bd', // 5% - 10%
            '#8dd3c2', // 10% - 20%
            '#6bc0c6', // 20% - 45%
            '#4ba8c9', // 45% - 70%
            '#2a89bd', // 70% - 90%
            '#0868ac'  // 90% +
        ];
                function getColor(v) {
            if (!v || v <= 0) return '#ffffff'; 

            // Recorremos los rangos desde el más alto al más bajo
            for (let i = RANGOS_CATEGORIAS.length - 1; i >= 0; i--) {
                if (v > RANGOS_CATEGORIAS[i]) {
                    return COLORES_CATEGORIAS[i];
                }
            }
            return COLORES_CATEGORIAS[0];
        }

        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).setView([-53.909, -66.863], 8);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }

        
        // 1. Definimos las URLs de los servidores en orden de prioridad
        const urlArgenmapGris = 'https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/mapabase_gris@EPSG:3857@png/{z}/{x}/{y}.png';
        const urlArgenmapNormal = 'https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capabaseargenmap@EPSG:3857@png/{z}/{x}/{y}.png';
        const urlOSM = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

        // 2. Creamos el panel para el mapa base
        map.createPane('pane_BaseMap_0');
        map.getPane('pane_BaseMap_0').style.zIndex = 0;

        // 3. Inicializamos la capa con la versión GRIS por defecto
        var layer_BaseMap_0 = L.tileLayer(urlArgenmapGris, {
            pane: 'pane_BaseMap_0',
            opacity: 1.0,
            attribution: 'IGN Argentina / OSM',
            minZoom: 1,
            maxZoom: 20,
            tms: true 
        });

        // 4. Lógica de Fallback (Respaldo)
        let intentos = 0;

        layer_BaseMap_0.on('tileerror', function(error) {
            // Si falla el primer intento (Gris), probamos con Argenmap Normal
            if (intentos === 0) {
                console.warn("Fallo Argenmap Gris, intentando Argenmap Normal...");
                this.setUrl(urlArgenmapNormal);
                intentos++;
            } 
            // Si falla el segundo (Normal), pasamos a OSM
            else if (intentos === 1) {
                console.warn("Fallo Argenmap Normal, pasando a OSM...");
                this.options.tms = false; // OSM no usa esquema TMS
                this.setUrl(urlOSM);
                intentos++;
            }
        });

        map.addLayer(layer_BaseMap_0);

        function pop_sudamerica_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['PAÍS'] !== null ? autolinker.link(String(feature.properties['PAÍS']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_sudamerica_1_0() {
            return {
                pane: 'pane_sudamerica_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(173,173,173,1.0)',
                interactive: false,
            }
        }
        map.createPane('pane_sudamerica_1');
        map.getPane('pane_sudamerica_1').style.zIndex = 401;
        map.getPane('pane_sudamerica_1').style['mix-blend-mode'] = 'normal';
        var layer_sudamerica_1 = new L.geoJson(json_sudamerica_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_sudamerica_1',
            layerName: 'layer_sudamerica_1',
            pane: 'pane_sudamerica_1',
            onEachFeature: pop_sudamerica_1,
            style: style_sudamerica_1_0,
        });
        bounds_group.addLayer(layer_sudamerica_1);
        map.addLayer(layer_sudamerica_1);
        function pop_provincia_TdFuego_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['gid'] !== null ? autolinker.link(String(feature.properties['gid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['entidad'] !== null ? autolinker.link(String(feature.properties['entidad']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fna'] !== null ? autolinker.link(String(feature.properties['fna']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['gna'] !== null ? autolinker.link(String(feature.properties['gna']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['nam'] !== null ? autolinker.link(String(feature.properties['nam']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['in1'] !== null ? autolinker.link(String(feature.properties['in1']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fdc'] !== null ? autolinker.link(String(feature.properties['fdc']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['sag'] !== null ? autolinker.link(String(feature.properties['sag']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_provincia_TdFuego_2_0() {
            return {
                pane: 'pane_provincia_TdFuego_2',
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 3.0, 
                fill: true,
                fillOpacity: 0,
                fillColor: 'rgba(0,0,0,1.0)',
                interactive: false,
            }
        }
        map.createPane('pane_provincia_TdFuego_2');
        map.getPane('pane_provincia_TdFuego_2').style.zIndex = 402;
        map.getPane('pane_provincia_TdFuego_2').style['mix-blend-mode'] = 'normal';
        var layer_provincia_TdFuego_2 = new L.geoJson(json_provincia_TdFuego_2, {
            attribution: '',
            interactive: false,
            dataVar: 'json_provincia_TdFuego_2',
            layerName: 'layer_provincia_TdFuego_2',
            pane: 'pane_provincia_TdFuego_2',
            onEachFeature: pop_provincia_TdFuego_2,
            style: style_provincia_TdFuego_2_0,
        });
        bounds_group.addLayer(layer_provincia_TdFuego_2);
        map.addLayer(layer_provincia_TdFuego_2);
        function pop_localidades_TdFuego_3(feature, layer) {
            
            // A. Esta sub-función genera el HTML del popup/tooltip sobre la marcha
            function getDynamicContent() {
                const nombreLoc = feature.properties['fna'] || "Localidad";
                // Buscamos el valor que el selector inyectó en la capa
                const valorRaw = layer.options.valorActual || 0; 
                const valorPorcentaje = (valorRaw * 100).toFixed(2) + '%';
                
                return `
                    <div style="text-align: center; font-family: sans-serif; min-width: 100px;">
                        <b style="font-size: 14px;">${nombreLoc}</b><br>
                        <span style="color: #3498db; font-weight: bold; font-size: 13px;">${valorPorcentaje}</span>
                    </div>
                `;
            }

            // B. Configuración de Eventos de Mouse
            layer.on({
                // Al pasar el mouse: Actualizamos el contenido y abrimos
                mouseover: function(e) {
                    layer.setPopupContent(getDynamicContent());
                    highlightFeature(e);
                    layer.openPopup();
                },
                // Al quitar el mouse: Cerramos el popup
                mouseout: function(e) {
                    layer.closePopup();
                },
                // Al hacer CLIC: Actualizamos el panel lateral
                click: function(e) {
                    const props = feature.properties;
                    const nombreLoc = props.fna;
                    const idLoc = Math.round(props.id_loc);
                    const nombreClave = mapeoLocalidades[idLoc];

                    const codGrupo = document.getElementById('indicadorSelect').value;
                    
                    // Mostramos el canvas y ocultamos el mensaje de ayuda inicial
                    document.getElementById('chart-header').style.display = 'block';
                    document.getElementById('vulnerabilidadChart').style.display = 'block';

                    if (codGrupo) {
                        const meta = indicadores_ref.find(g => g.cod_grupo === codGrupo);
                        
                        // Si es binario, generamos la torta
                        if (meta.tipo === "Binario") {
                            generarGraficoBinario(nombreLoc, codGrupo, nombreClave);
                        } 
                        else if (meta.tipo === "Categorizado") {
                            generarGraficoCategorizado(nombreLoc, codGrupo, nombreClave);
                        }
                        else if (meta.tipo === "Agrupacion") {
                            generarGraficoAgrupado(nombreLoc, codGrupo, nombreClave);
                        }
                        else if (meta.tipo === "Tasa") {
                            const tituloX = `Número de ${meta.unidad || ""}`;
                            generarGraficoCategorizado(nombreLoc, codGrupo, nombreClave, tituloX);
                        }
                        else {tituloX
                            // Manejo para otros tipos que aún no tienen lógica de gráfico
                            if (miGrafico) miGrafico.destroy();
                            document.getElementById('vulnerabilidadChart').style.display = 'none';
                            document.getElementById('chart-header').style.display = 'block';
                            document.getElementById('chart-header').innerHTML = `<h4>${nombreLoc}</h4><p>Gráfico para tipo ${meta.tipo} en desarrollo.</p>`;
                        }
                    }
                }
            });

            // C. Vinculación inicial del Popup (con estilo de tooltip)
            layer.bindPopup(getDynamicContent(), { 
                maxHeight: 400, 
                closeButton: false,
                offset: L.point(0, -10) // Sube un poco el cartel para que no tape el punto
            });
        }

        // 4. Función de Estilo (Corregida para Leaflet)
        function style_localidades_TdFuego_3_0(feature) {
            let valor = 0;
            if (typeof layer_localidades_TdFuego_3 !== 'undefined') {
                layer_localidades_TdFuego_3.eachLayer(function(l) {
                    if (l.feature.properties.id_loc === feature.properties.id_loc) {
                        valor = l.options.valorActual || 0;
                    }
                });
            }
            return {
                pane: 'pane_localidades_TdFuego_3',
                radius: (valor <= 0) ? 12.0 : calcularRadio(valor),
                stroke: (valor === 0 || isNaN(valor)) ? true : false,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                weight: 1,
                fill: true,
                fillOpacity: 0.9,
                fillColor: getColor(valor),
                interactive: true,
            }
        }



        map.createPane('pane_localidades_TdFuego_3');
        map.getPane('pane_localidades_TdFuego_3').style.zIndex = 403;
        map.getPane('pane_localidades_TdFuego_3').style['mix-blend-mode'] = 'normal';
        var layer_localidades_TdFuego_3 = new L.geoJson(json_localidades_TdFuego_3, {

                for (var i=0; i < options.length; i++) {
                    options[i].selected = false;

                filterFunc();

            div_PAS.appendChild(reset_PAS);

        </script>
        <script>
            // CONSTRUCCION DE GRAFICOS
            let miGrafico = null;
            function generarGraficoBinario(nombreLoc, codGrupo, nombreClave) {
                const ctx = document.getElementById('vulnerabilidadChart').getContext('2d');
                const chartHeader = document.getElementById('chart-header');
                const canvasElement = document.getElementById('vulnerabilidadChart');

                // 1. Obtener metadatos y valores
                const meta = indicadores_ref.find(g => g.cod_grupo === codGrupo);
                if (meta.tipo !== "Binario") return;

                const val_1 = 100*datos_localidad[codGrupo]["1"][nombreClave];
                const val_0 = 100*datos_localidad[codGrupo]["0"][nombreClave];

                // 2. Limpiar UI
                chartHeader.innerHTML = `<h4 style="margin:0 0 10px 0;">${nombreLoc}: ${meta.grupo_nom}</h4>`;
                canvasElement.style.display = 'block';

                // 3. Destruir gráfico previo si existe para evitar solapamientos
                if (miGrafico) {
                    miGrafico.destroy();
                }

                // 4. Crear Gráfico de Torta
                miGrafico = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: [meta.variables["1"].label, meta.variables["0"].label],
                        datasets: [{
                            data: [val_1, val_0],
                            backgroundColor: ['#0077b6', '#90e0ef'], 
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } }
                        }
                    }
                });
            }
            
            function generarGraficoCategorizado(nombreLoc, codGrupo, nombreClave, tituloX = "") {
                const ctx = document.getElementById('vulnerabilidadChart').getContext('2d');
                const chartHeader = document.getElementById('chart-header');
                const canvasElement = document.getElementById('vulnerabilidadChart');

                // 1. Obtener metadatos
                const meta = indicadores_ref.find(g => g.cod_grupo === codGrupo);
                
                // 2. Preparar etiquetas y datos
                const labels = [];
                const datosValores = [];
                
                Object.keys(meta.variables).forEach(key => {
                    const vInfo = meta.variables[key];
                    const labelEjeX = vInfo.xtick ? vInfo.xtick : vInfo.label;
                    labels.push(labelEjeX);

                    //labels.push(meta.variables[key].label);
                    // Convertimos la proporción a porcentaje (0-100)
                    const valorPerc = (datos_localidad[codGrupo][key][nombreClave] * 100).toFixed(2);
                    datosValores.push(valorPerc);
                });

                // 3. UI y Limpieza
                chartHeader.innerHTML = `<h4 style="margin:0 0 10px 0;">${nombreLoc}: ${meta.grupo_nom}</h4>`;
                canvasElement.style.display = 'block';

                if (miGrafico) {
                    miGrafico.destroy();
                }

                const limiteY = calcularMaximoEje(datosValores);

                // 4. Crear Gráfico de Barras Verticales
                miGrafico = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Porcentaje de población',
                            data: datosValores,
                            backgroundColor: '#3498db',
                            borderColor: '#2980b9',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: limiteY,
                                ticks: {
                                    callback: function(value) { return value + "%"; }
                                }
                            },
                            x:{
                                title:{
                                    display: tituloX !== "",
                                    text: tituloX,
                                    font: { size: 11, weight: 'bold' }                                    
                                },
                                ticks: {
                                    autoSkip: false,
                                    maxRotation: 45,
                                    minRotation: 30
                                }
                            }
                        },
                        plugins: {
                            legend: { display: false }, // Ocultamos leyenda ya que solo hay una serie
                            tooltip: {
                                callbacks: {
                                    label: function(context) { return context.raw + "%"; }
                                }
                            }
                        }
                    }  
                }              
            );
            }


            const PALETA_MAESTRA = {
                1: "#e74c3c", // Rojo (Inseguridad Alimentaria / Informalidad)
                2: "#f1c40f", // Amarillo (Línea de Pobreza / Precariedad)
                3: "#3498db", // Azul (NBI / Inestabilidad)
                0: "#6e6e6e"  // Verde (Sin vulnerabilidad / Formal)
            };
            
            function patronDiagonales(listaIds, grosorBase = 30) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Obtenemos los colores reales de la paleta usando los IDs
                const colores = listaIds.map(id => PALETA_MAESTRA[id] || '#ccc');
                const n = colores.length;

                // Ajustamos el tamaño del canvas para que la repetición sea fluida
                // Multiplicamos por n para que cada franja tenga espacio suficiente
                canvas.width = grosorBase;
                canvas.height = grosorBase;

                // Dibujamos franjas diagonales
                // Para que sean N franjas iguales, desplazamos el dibujo
                for (let i = 0; i < n; i++) {
                    ctx.fillStyle = colores[i];
                    
                    // Dibujamos cada franja como un polígono (trapecio) diagonal
                    ctx.beginPath();
                    const paso = grosorBase / n;
                    const inicio = i * paso;
                    const fin = (i + 1) * paso;

                    // Definimos la geometría de la franja diagonal
                    ctx.moveTo(inicio, 0);
                    ctx.lineTo(fin, 0);
                    ctx.lineTo(0, fin);
                    ctx.lineTo(0, inicio);
                    ctx.fill();

                    // Dibujamos la contraparte en la esquina opuesta para el "seamless repeat"
                    ctx.moveTo(inicio, grosorBase);
                    ctx.lineTo(fin, grosorBase);
                    ctx.lineTo(grosorBase, fin);
                    ctx.lineTo(grosorBase, inicio);
                    ctx.fill();
                }

                return ctx.createPattern(canvas, 'repeat');
            }

            function calcularMaximoEje(valores) {
                // Obtenemos el valor más alto del array de datos (ya en formato 0-100)
                const maxReal = Math.max(...valores);    
                // Si el máximo es 0, devolvemos 10 como base
                if (maxReal <= 0) return 10;   
                // Redondeamos al siguiente múltiplo de 10
                return Math.ceil((maxReal + 5) / 5) * 5;
            }

            function generarGraficoAgrupado(nombreLoc, codGrupo, nombreClave) {
                const ctx = document.getElementById('vulnerabilidadChart').getContext('2d');
                const chartHeader = document.getElementById('chart-header');
                const meta = indicadores_ref.find(g => g.cod_grupo === codGrupo);
                
                chartHeader.innerHTML = `<h4 style="margin: 0; font-size: 14px; text-align: center;">${nombreLoc}: ${meta.grupo_nom}</h4>`;

                const labels = [];
                const datosValores = [];
                const backgroundColors = [];
                
                // 1. Unificamos la recolección de datos y colores en un solo ciclo
                Object.keys(meta.variables).forEach(key => {
                    const vInfo = meta.variables[key];
                    
                    // Añadimos la etiqueta (una sola vez)
                    labels.push(vInfo.label);
                    
                    // Calculamos el valor porcentual
                    const valor = (datos_localidad[codGrupo][key][nombreClave] * 100);
                    datosValores.push(valor.toFixed(2));

                    const componentes = vInfo.incluye_clases || [];
                    let finalColor;

                    if (componentes.length === 1) {
                        // Color sólido para indicadores simples
                        finalColor = PALETA_MAESTRA[componentes[0]];
                    } else if (componentes.length > 1) {
                        // Patrón de franjas diagonales para indicadores combinados
                        finalColor = patronDiagonales(componentes, 30);
                    } else {
                        finalColor = '#cccccc'; // Color de respaldo
                    }

                    backgroundColors.push(finalColor);
                });

                // 3. Calculamos el máximo del eje dinámico solo para esta localidad
                const limiteY = calcularMaximoEje(datosValores);

                if (miGrafico) miGrafico.destroy();

                miGrafico = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{ 
                            data: datosValores, 
                            backgroundColor: backgroundColors, 
                            borderWidth: 1,
                            borderColor: '#333'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { 
                                beginAtZero: true, 
                                max: limiteY, 
                                ticks: { callback: v => v + "%" } 
                            },
                            x: { 
                                ticks: { 
                                    font: { size: 9 }, 
                                    autoSkip: false,
                                    maxRotation: 45,
                                    minRotation: 45
                                } 
                            }
                        },
                        plugins: { 
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: (context) => `Población: ${context.raw}%`
                                }
                            }
                        }
                    }
                });
            }

            function generarGraficoTasas(nombreLoc, codGrupo, nombreClave) {
                const ctx = document.getElementById('vulnerabilidadChart').getContext('2d');
                const chartHeader = document.getElementById('chart-header');
                const meta = indicadores_ref.find(g => g.cod_grupo === codGrupo);
                
                chartHeader.innerHTML = `<h4 style="margin: 0; font-size: 14px; text-align: center;">${nombreLoc}: ${meta.grupo_nom}</h4>`;

                const labels = [];
                const datosValores = [];
                const colores = [];

                Object.keys(meta.variables).forEach(key => {
                    const vInfo = meta.variables[key];
                    labels.push(vInfo.label); // Ejemplo: "100,00"
                    
                    const porcentajeHogares = (datos_localidad[codGrupo][key][nombreClave] * 100);
                    datosValores.push(porcentajeHogares.toFixed(2));

                    // Color dinámico: más oscuro cuanta más dependencia
                    const intensidad = Math.min(255, parseInt(key) * 30);
                    colores.push(`rgb(52, 152, ${219 - (key * 15)})`); 
                });

                const limiteY = calcularMaximoEje(datosValores);

                if (miGrafico) miGrafico.destroy();

                miGrafico = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '% de Hogares',
                            data: datosValores,
                            backgroundColor: '#9b59b6', // Color distintivo para tasas
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { 
                                title: { display: true, text: '% de Hogares' },
                                beginAtZero: true, 
                                max: limiteY 
                            },
                            x: { title: { display: true, text: 'Valor de la Tasa (Dep/100 Activos)' } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }

            function limpiarGrafico() {
                if (miGrafico) {
                    miGrafico.destroy();
                    miGrafico = null;
                }
                // Restauramos el mensaje de ayuda inicial
                const chartHeader = document.getElementById('chart-header');
                const canvasElement = document.getElementById('vulnerabilidadChart');
                
                chartHeader.innerHTML = `
                    <p style="font-size: 12px; color: #95a5a6; text-align: center; margin: 10px 0;">
                        Haga clic en una localidad para ver el gráfico.
                    </p>`;
                chartHeader.style.display = 'block';
                canvasElement.style.display = 'none';
            }

        </script>
        <script>
            // Aseguramos que el código corra solo cuando el HTML esté cargado
            document.addEventListener('DOMContentLoaded', function() {
                
                // 1. Verificar que los datos existan
                if (typeof indicadores_ref === 'undefined' || typeof datos_localidad === 'undefined') {
                    console.error("Los archivos de datos no se cargaron correctamente.");
                    return;
                }

                const selectInd = document.getElementById('indicadorSelect');
                const selectVar = document.getElementById('variableSelect');

                // 2. Llenar el primer selector
                selectInd.innerHTML = '<option value="">Seleccione un indicador...</option>';
                indicadores_ref.forEach(grupo => {
                    let opt = document.createElement('option');
                    opt.value = grupo.cod_grupo;
                    opt.innerHTML = `${grupo.grupo_nom}`;
                    selectInd.appendChild(opt);
                });

                // 3. Evento Indicador (Padre)
                selectInd.addEventListener('change', function () {
                    const codGrupo = this.value;
                    const infoContainer = document.getElementById('info-variable-container');
                    const infoDesc = document.getElementById('info-desc');

                    //Vaciar información previa
                    limpiarGrafico();
                    selectVar.innerHTML = '<option value="">Seleccione un Indicador Específico...</option>';

                    document.getElementById('report-data').innerHTML = '<p style="color: #7f8c8d; font-style: italic;">Ahora seleccione un indicador específico.</p>';

                    if (!codGrupo) {
                        selectVar.disabled = true;
                        infoContainer.style.display = 'none';
                        document.getElementById('report-data').innerHTML = '<p style="color: #7f8c8d;">Seleccione una variable para analizar.</p>';
                        return;
                    }

                    const grupoData = indicadores_ref.find(g => g.cod_grupo === codGrupo);

                    if (grupoData) {
                        if (grupoData.desc_grupo) {
                            infoDesc.innerText = grupoData.desc_grupo;
                            infoContainer.style.display = 'block';
                        }
                        Object.keys(grupoData.variables).forEach(key => {
                            let opt = document.createElement('option');
                            opt.value = key;
                            opt.innerHTML = grupoData.variables[key].label;
                            selectVar.appendChild(opt);
                        });
                    } else {
                        infoContainer.style.display = 'none';
                    }

                    selectVar.disabled = false;
                });

                // 4. Evento Variable (Hijo)
                selectVar.addEventListener('change', function () {
                    const codGrupo = selectInd.value;
                    const codVar = this.value;
                    if (!codGrupo || !codVar) return;

                    const dataFinal = datos_localidad[codGrupo][codVar];
                    
                    if (typeof layer_localidades_TdFuego_3 !== 'undefined') {
                        layer_localidades_TdFuego_3.eachLayer(function(layer) {
                            const idLoc = Math.round(layer.feature.properties.id_loc);
                            const nombreClave = mapeoLocalidades[idLoc];
                            
                            layer.options.valorActual = dataFinal[nombreClave] || 0;
                        });

                        layer_localidades_TdFuego_3.setStyle(style_localidades_TdFuego_3_0);
                        layer_localidades_TdFuego_3.eachLayer(function(layer) {
                            if (typeof layer.setPopupContent === 'function') {
                                const nombreLoc = layer.feature.properties.fna;
                                const valorPorcentaje = (layer.options.valorActual * 100).toFixed(2) + '%';
                                layer.setPopupContent(`<b>${nombreLoc}</b><br><span style="color:#3498db;">${valorPorcentaje}</span>`);
                            }
                        });
                       actualizarExtract(codGrupo, codVar, dataFinal); 
                    }
                });



                const legendDiv = document.getElementById('legend-container');

                // Función para actualizar el contenido de la leyenda
                function actualizarLeyenda() {
                    let html = '<strong>Referencias (%)</strong><br><br>';
                    const SEPARACION_FIJA = 10; // Los 5px de separación que solicitaste

                    for (let i = 0; i < RANGOS_CATEGORIAS.length; i++) {
                        let color = COLORES_CATEGORIAS[i];
                        let radioVisual = calcularRadio(RANGOS_CATEGORIAS[i]); 
                        
                        // El alto total de la fila será el tamaño del círculo + la separación fija
                        let altoFila = radioVisual + SEPARACION_FIJA;

                        let textoRango;
                        if (i === 0) {
                            textoRango = "Sin datos";
                        } else if (i === 1) {
                            textoRango = "0 &ndash; 5%";
                        } else {
                            const actual = RANGOS_CATEGORIAS[i] * 100;
                            const siguiente = RANGOS_CATEGORIAS[i + 1] ? RANGOS_CATEGORIAS[i + 1] * 100 : null;
                            textoRango = siguiente ? `${actual} &ndash; ${siguiente}%` : `${actual}+ %`;
                        }

                        html += `
                            <div class="legend-item" style="height: ${altoFila}px; margin-bottom: 2px;">
                                <div class="legend-icon-container" style="width: 50px; height: ${altoFila}px; display: flex; justify-content: center; align-items: center; margin-right: 15px;">
                                    <i style="background: ${color}; alpha: 0.5; width: ${radioVisual}px; height: ${radioVisual}px; flex-shrink: 0; border-radius: 50%; border: 1px solid #999; display: inline-block;"></i>
                                </div>
                                <span style="white-space: nowrap; font-size: 12px; line-height: ${altoFila}px;">${textoRango}</span>
                            </div>`;
                    }

                    legendDiv.innerHTML = html;
                    legendDiv.style.display = 'block';
                }

                // Creamos un control de Leaflet que "envuelva" nuestro div existente
                var legendControl = L.control({position: 'topright'});
                legendControl.onAdd = function() {
                    return legendDiv;
                };
                legendControl.addTo(map);

                // Llamamos a la función para que se llene al cargar
                actualizarLeyenda();
            });
            </script>
